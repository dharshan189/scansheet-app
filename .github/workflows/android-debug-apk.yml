name: Build Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      vercel_api_url:
        description: "Optional deployed Vercel HTTPS URL (e.g. https://scansheet.vercel.app)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare web assets and sync Capacitor Android
        env:
          VERCEL_API_URL: ${{ inputs.vercel_api_url || vars.VERCEL_API_URL || secrets.VERCEL_API_URL || '' }}
        run: |
          npm run cap:prepare
          npx cap sync android

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scansheet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

