name: Build Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      vercel_api_url:
        description: "Optional deployed Vercel HTTPS URL (e.g. https://scansheet.vercel.app)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare Android SDK licenses and platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
          else
            echo "sdkmanager not found; relying on preinstalled SDK and Gradle auto-install"
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare web assets, sync Capacitor Android, and verify config
        env:
          VERCEL_API_URL: ${{ inputs.vercel_api_url || vars.VERCEL_API_URL || secrets.VERCEL_API_URL || '' }}
        run: |
          npm run cap:prepare
          npx cap sync android
          npm run verify

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scansheet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
